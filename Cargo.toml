[package]
name = "rusty-setup"
version = "0.1.0"
edition = "2021"
description = "An Inno Setup style installer builder and wizard, written in Rust"

[dependencies]
eframe = "0.29"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
winreg = "0.52"

# The generated setup.exe is a copy of this exe, so keep it small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
