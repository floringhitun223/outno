[package]
name = "outno"
version = "0.3.0"
edition = "2021"
description = "OUTNO - lightweight setup creator for Windows apps, written in Rust"
license = "MIT"
repository = "https://github.com/floringhitun223/outno"
build = "build.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
winreg = "0.52"

# The generated setup.exe is a copy of this exe, so keep it small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
